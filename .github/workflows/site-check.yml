name: Website-Prüfung (Staging/Produktion)

# Prüft eine laufende Installation von außen: Smoke-Test, alle Seiten in allen Breiten mit axe,
# Tastaturbedienung. Ziel-URL als Repository-Variable SITE_URL hinterlegen
# (Settings → Secrets and variables → Actions → Variables). Ohne SITE_URL wird nichts geprüft.
# Shop-Pfade optional als Variable SHOP_PATHS, z. B. "/shop/,/warenkorb/,/kasse/,/mein-konto/".

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Basis-URL (leer = Variable SITE_URL)"
        required: false
  schedule:
    - cron: "43 5 * * 1"

permissions:
  contents: read

jobs:
  site:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      BROWSER: ${{ matrix.browser }}
      BASE: ${{ inputs.url || vars.SITE_URL }}
      SHOP: ${{ vars.SHOP_PATHS }}
    steps:
      - name: Ziel vorhanden?
        id: target
        run: |
          if [ -z "$BASE" ]; then echo "Keine SITE_URL hinterlegt – Prüfung übersprungen."; echo "run=false" >> "$GITHUB_OUTPUT"; else echo "run=true" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/checkout@v4
        if: steps.target.outputs.run == 'true'

      - uses: actions/setup-node@v4
        if: steps.target.outputs.run == 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tools/qa/package-lock.json

      - name: Abhängigkeiten und Chromium
        if: steps.target.outputs.run == 'true'
        working-directory: tools/qa
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps "$BROWSER"

      - name: Smoke-Test
        if: steps.target.outputs.run == 'true'
        working-directory: tools/qa
        run: |
          if [ -n "$SHOP" ]; then node smoke.cjs --base "$BASE" --shop --shop-paths "$SHOP"; else node smoke.cjs --base "$BASE"; fi

      - name: Alle Seiten, alle Breiten, axe
        if: steps.target.outputs.run == 'true'
        working-directory: tools/qa
        run: node site-check.cjs --base "$BASE" --axe --all-widths ${SHOP:+--seed "$SHOP"} --ignore-axe label-content-name-mismatch

      - name: Tastatur und Fokus
        # Tab-Reihenfolge ist in WebKit ohne Systemeinstellung „Alle Steuerelemente“ eingeschränkt.
        if: steps.target.outputs.run == 'true' && matrix.browser != 'webkit'
        working-directory: tools/qa
        run: node keyboard.cjs --base "$BASE"
